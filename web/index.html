<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#242424" />
    <title>chatski</title>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <!-- name modal -->
    <div id="nameModal" class="modal-overlay">
      <div class="modal-box">
        <h2>Welcome to my chat</h2>

        <p>What's yo name?!</p>

        <input
          type="text"
          id="nameInput"
          placeholder="Your name..."
          autocomplete="off"
        />

        <button id="joinBtn">Join Chat</button>
      </div>
    </div>

    <!-- chat ui -->
    <div class="chat-container">
      <div class="chat-header">
        <div class="status-dot"></div>
        <span class="title">chatski</span>

        <button id="installBtn" class="install-btn" hidden>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M11 2a1 1 0 1 1 2 0v9.586l2.293-2.293a1 1 0 0 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4a1 1 0 0 1 1.414-1.414L11 11.586V2zM4 19a1 1 0 0 1 1-1h14a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1z"
            />
          </svg>
          <span class="install-label">Install</span>
        </button>
      </div>

      <div id="messages"></div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        />
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </body>
</html>
