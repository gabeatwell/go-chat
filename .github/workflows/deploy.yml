name: Deploy to Oracle Cloud

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Build for ARM64
              run: |
                  GOOS=linux GOARCH=arm64 go build -ldflags "-X main.buildVersion=$(git rev-parse --short HEAD)" -o chat-server ./cmd/server

            - name: Deploy via SCP
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "chat-server,web/"
                  target: "/home/ubuntu/"
                  strip_components: 0

            - name: Restart service
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      sudo systemctl restart chat

            - name: Set VAPID env vars
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      sudo mkdir -p /etc/systemd/system/chat.service.d
                      echo -e "[Service]\nEnvironment=VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}\nEnvironment=VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}" | sudo tee /etc/systemd/system/chat.service.d/env.conf > /dev/null
                      sudo systemctl daemon-reload
                      sudo systemctl restart chat
